                      value: "db"
                    - name: DB_NAME
                      value: "course_enrollment"
                    - name: DB_PASS
                      value: "apppass"
                    - name: DB_USER
                      value: "appuser"
                    - name: SITE_NAME
                      value: "Course Enrollment System"
                  ports:
                    - name: app-9000
                      containerPort: 9000
                  volumeMounts:
                    - name: app
                      mountPath: /app
                    - name: app-uploads
                      mountPath: /app/uploads
            volumes:
                - name: app
                  hostPath:
                    path: C:\xampp\htdocs\course-enrollment
                - name: app-uploads
                  hostPath:
                    path: C:\xampp\htdocs\course-enrollment\uploads
