apiVersion: apps/v1
kind: Deployment
metadata:
    name: app
    namespace: course-enrollment
    labels:
        com.docker.compose.project: course-enrollment
        com.docker.compose.service: app
spec:
    replicas: 1
    selector:
        matchLabels:
            com.docker.compose.project: course-enrollment
            com.docker.compose.service: app
    strategy:
        type: Recreate
    template:
        metadata:
            labels:
                com.docker.compose.project: course-enrollment
                com.docker.compose.service: app
                com.docker.compose.network.course-network: "true"
        spec:
            restartPolicy: unless-stopped
            containers:
                - name: course-enrollment-app
                  image: course-enrollment-app
                  imagePullPolicy: IfNotPresent
                  workingDir: /app
                  env:
                    - name: APP_ENV
                      value: "development"
                    - name: APP_URL
                      value: "http://localhost:8080/"
