services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: course-enrollment-app
    restart: unless-stopped
    working_dir: /app
    environment:
    - DB_HOST=db
    - DB_NAME=course_enrollment
    - DB_USER=appuser
    - DB_PASS=apppass
    - APP_ENV=development
    - APP_URL=http://localhost:8080/
    - SITE_NAME=Course Enrollment System
    volumes:
      - ./:/app
      - ./uploads:/app/uploads
    networks:
      - course-network
    depends_on:
      db:
        condition: service_healthy
    # No healthcheck needed here unless your PHP-FPM image exposes an HTTP port too.
    # If you want one, check FPM's status page instead of curling index.php on 9000.

  nginx:
    image: nginx:alpine
    container_name: course-enrollment-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./:/app
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - course-network
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/index.php"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: mysql:8.0
    container_name: course-enrollment-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: course_enrollment
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - course-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:

networks:
  course-network:
    driver: bridge